# AlphaZero training configuration — fresh start after Gumbel off-policy fix (Known Issue #29)
# Tuned for Jetson Orin Nano Super (8GB shared, CUDA 12.6)
#
# Key changes from previous run:
# - Gumbel re-enabled with on-policy fix (Known Issue #29 fixed in commit 0733997)
# - 128 sims, k=16 (~1.8 visits/action/round — adequate for learning signal)
# - Fresh checkpoint dir (old buffer was poisoned by off-policy targets)
network:
  num_res_blocks: 10
  num_filters: 256
  input_planes: 18
  board_size: 8
  value_head_dropout: 0.3          # Prevent value head memorization (Known Issue #27).

mcts:
  num_simulations: 128         # 128 sims with Gumbel k=16. ~16 min/iter for fast feedback.
  min_selfplay_simulations: 128 # Match base sims — adaptive scaling starts from here
  cpuct: 4.0                   # High cpuct trusts policy prior over noisy Q-values.
  value_scale: 0.5             # Scale NN value predictions before MCTS backprop.
  dirichlet_alpha: 0.15            # Spikier noise for fewer legal moves than Go
  dirichlet_epsilon: 0.4            # 40% noise to break self-play overfitting
  temperature_threshold: 30    # Exploit in middlegame/endgame where tactics matter

gumbel:
  enabled: true                    # Re-enabled after off-policy fix (Known Issue #29, commit 0733997).
                                   # Move selection now uses visit distribution (same as policy target).
  max_num_considered_actions: 16   # k=16 at 128 sims: 128/(16*5 rounds) ≈ 1.6 visits/action/round.
                                   # Truncates ~50% of legal moves (avg 37) but Sequential Halving
                                   # focuses budget on promising actions anyway.
  gumbel_scale: 1.0               # Scale of Gumbel noise
  maxvisit_init: 50.0             # Q-transform: baseline visit scale
  value_scale: 0.1                # Q-transform: Q-value scaling factor

selfplay:
  num_games_per_iteration: 20  # 10 selfplay + 10 vs-random with 50% fraction.
  replay_buffer_size: 20000    # Total (informational only, actual = seed + decisive + draw)
  buffer_seed_size: 12000      # Permanent seed partition (checkmates, tactical wins)
  buffer_decisive_size: 10000  # Circular: self-play decisive positions
  buffer_draw_size: 5000       # Circular: self-play draw positions
  num_workers: 4               # CPU worker processes for MCTS tree traversal
  min_buffer_size: 1000        # Train immediately on seed games
  random_opponent_fraction: 0.5   # 50% vs random for decisive signal to bootstrap value head
  parallel_games: 20             # Fallback for single-process mode (multiprocess ignores this)
  draw_value_target: 0.0       # Neutral — -0.1 caused systematic pessimism
  policy_target_smoothing: 0.0 # Disabled for now.

training:
  optimizer: muon               # muon = Muon for conv/hidden + SGD for heads/biases/BN
  batch_size: 128
  learning_rate: 0.01           # Muon LR
  muon_momentum: 0.95           # Muon momentum (default)
  head_lr: 0.001                # SGD LR for policy/value heads and biases
  momentum: 0.9
  weight_decay: 0.0001
  value_loss_weight: 10.0      # Give value head ~14.5% of gradient.
  policy_freeze_iterations: 0  # Disabled
  policy_entropy_weight: 0.0   # Disabled
  draw_sample_weight: 0.4      # Downweight draw positions in loss vs decisive outcomes
  steps_per_iteration: 400     # ~2 passes through buffer.
  checkpoint_interval: 100
  elo_probe_interval: 10       # Network-vs-network probe every 10 iters
  elo_probe_games: 10          # 10 games vs reference network
  elo_probe_max_moves: 200     # Match self-play turn limit
  adaptive_elo_smoothing: 0.7  # Smooth probe ELO before mapping to adaptive sims
  seed_removal_elo: 650        # Clear seed partition once ELO exceeds this
  seed_sample_weight_init: 0.0  # DISABLED: seeds have 4:1 White win bias
  seed_sample_weight_decay: 0.93
  seed_sample_weight_min: 0.0
  max_iterations: 2000

paths:
  checkpoint_dir: "checkpoints/on_policy_fix_20260308"
  log_dir: "logs/on_policy_fix_20260308"
  training_log: "training_log.jsonl"
