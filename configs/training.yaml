# AlphaZero training configuration
# Tuned for Jetson Orin Nano Super (8GB shared, CUDA 12.6)
network:
  num_res_blocks: 10
  num_filters: 256
  input_planes: 18               # Planes 14-17 zeroed (shortcut metadata removed)
  board_size: 8
  value_head_dropout: 0.3

mcts:
  num_simulations: 128
  min_selfplay_simulations: 128
  cpuct: 4.0                     # Trust policy prior over noisy Q-values
  value_scale: 0.5               # Dampen raw value predictions in MCTS backprop
  dirichlet_alpha: 0.15
  dirichlet_epsilon: 0.4
  temperature_threshold: 30

gumbel:
  enabled: false

selfplay:
  num_games_per_iteration: 40
  replay_buffer_size: 30000
  buffer_seed_size: 12000
  buffer_decisive_size: 20000
  buffer_draw_size: 10000
  num_workers: 4
  min_buffer_size: 1000
  random_opponent_fraction: 0.5
  parallel_games: 20
  draw_value_target: 0.0
  policy_target_smoothing: 0.0
  selfplay_opening_plies: 4

training:
  optimizer: muon
  batch_size: 128
  learning_rate: 0.01             # Muon LR for trunk convs
  muon_momentum: 0.95
  head_lr: 0.001                  # SGD LR for heads/biases/BN
  momentum: 0.9
  weight_decay: 0.0001
  value_loss_weight: 10.0
  policy_freeze_iterations: 0
  policy_entropy_weight: 0.0
  draw_sample_weight: 0.4
  steps_per_iteration: 200
  checkpoint_interval: 100
  elo_probe_interval: 10
  elo_probe_games: 10
  elo_probe_max_moves: 200
  adaptive_elo_smoothing: 0.7
  seed_removal_elo: 650
  seed_sample_weight_init: 0.0
  seed_sample_weight_decay: 0.93
  seed_sample_weight_min: 0.0
  max_iterations: 2000

paths:
  checkpoint_dir: "checkpoints/on_policy_fix_20260308"
  log_dir: "logs/on_policy_fix_20260308"
  training_log: "training_log.jsonl"
